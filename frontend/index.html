<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Technology-Store</title>
  <link rel="icon" href="/resources/icons/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
  <script>
    // theme before the first paint (see src/theme.js): the saved choice, otherwise the system one
    try {
      document.documentElement.dataset.theme = localStorage.getItem("theme")
        || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch (e) {}
  </script>
  <!-- three.js for the 3D case of the PC builder (frontend/vendor/three), loaded only on that page -->
  <script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
  </script>
  <link rel="stylesheet" href="/src/style.css">
  <script type="module" src="/src/app.js"></script>
</head>
<body>
  <header id="header"></header>
  <div id="flash" role="status"></div>
  <main id="main"></main>
  <footer id="footer"></footer>
</body>
</html>
