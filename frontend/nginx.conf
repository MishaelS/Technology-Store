# Serves the frontend and shared resources (icons) from the repository.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Development: always ask the server for fresh files, so code changes show up after a normal reload
    add_header Cache-Control "no-cache" always;

    # API on the same address as the site: /api/... goes to the backend container.
    # So the site works through one port only (e.g. a tunnel or a forwarded port 5173), without CORS.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m; # picture uploads are up to 5 MB
    }

    # resources/ folder of the repository: /resources/icons/navigation/cart.svg
    location /resources/ {
        alias /usr/share/nginx/resources/;
    }

    # pictures uploaded in the admin panel (POST /api/admin/uploads): /uploads/<name>.png
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
