# Serves the frontend and shared resources (icons) from the repository.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Development: always ask the server for fresh files, so code changes show up after a normal reload
    add_header Cache-Control "no-cache" always;

    # resources/ folder of the repository: /resources/icons/navigation/cart.svg
    location /resources/ {
        alias /usr/share/nginx/resources/;
    }
}
