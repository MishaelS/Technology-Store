# Serves the frontend and shared resources (icons, photos) from the repository.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # text files go compressed: CSS, JS, JSON and SVG get 3-5x smaller on the way
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # Development: the code asks the server every time (a cheap "not changed" answer most of the time),
    # so code changes show up after a normal reload
    add_header Cache-Control "no-cache" always;

    # API on the same address as the site: /api/... goes to the backend container.
    # So the site works through one port only (e.g. a tunnel or a forwarded port 5173), without CORS.
    # backups uploaded in the admin panel can be big (the API allows up to 500 MB)
    location = /api/admin/backups/upload {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 520m; # the file is taken whole first, then passed on: an early answer can't cut it
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m; # picture uploads are up to 5 MB
    }

    # resources/ folder of the repository: /resources/icons/navigation/cart.svg
    location /resources/ {
        alias /usr/share/nginx/resources/;
    }

    # pictures of the repository (icons, product photos, demo pictures): the browser keeps them for a day,
    # so going back and forth between pages doesn't ask for them again
    location ~ ^/resources/(.+\.(svg|webp|png|jpe?g|gif))$ {
        alias /usr/share/nginx/resources/$1;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # pictures uploaded in the admin panel (POST /api/admin/uploads): /uploads/<name>.png
    # Their names are random and never reused, so the browser may keep them for a year.
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
